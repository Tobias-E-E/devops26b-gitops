apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` field here on purpose — the Flux Kustomization CR that
# applies this overlay (../../flux/prod/kustomization.yaml) sets
# spec.targetNamespace, so placement is Flux's job, not kustomize's.
# See ../../README.md.

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      environment: prod

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2

images:
  - name: ghcr.io/tobias-e-e/template-app-frontend
    newTag: 4616f40db8dd62b8b8cc4735427e5e424e387645
  - name: ghcr.io/tobias-e-e/template-app-backend
    newTag: 4616f40db8dd62b8b8cc4735427e5e424e387645
